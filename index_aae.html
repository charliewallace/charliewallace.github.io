<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QQR7C3RXVP"></script>
  <script>

    gtag('config', 'G-QQR7C3RXVP');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CoolweirdClocks</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="modal-fixes.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N0L8F40M22"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-N0L8F40M22');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
</head>

<body>
  <div id="app-container">
    <div id="canvas-container"></div>
    <div id="mobius-container" class="hidden"></div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer">

      <!-- Top Left: Controls & Info -->
      <div id="top-left-container" class="ui-corner">
        <h1 id="app-title">Day Spiral Clock</h1>
        <div id="app-version" class="version-text"></div>
        <div id="app-description" class="desktop-only">
          <!-- Content injected via JS -->
        </div>

        <div class="button-group">
          <button id="btn-gps-ok" class="ui-btn desktop-only">GPS OK?</button>
          <button id="btn-gps-ok-mobile" class="ui-btn mobile-only">GPS OK?</button>
          <button id="btn-about" class="ui-btn">About</button>
        </div>
      </div>

      <!-- Top Right: Time & Location Controls -->
      <div id="top-right-container" class="ui-corner">
        <div class="top-row-group">
          <div id="time-display-large" class="desktop-only"></div>
          <div id="time-display" class="mobile-only"></div>
        </div>

        <div id="location-info">
          <!-- Desktop Location Description -->
          <div id="location-description" class="desktop-only text-right"></div>
          <!-- Mobile Title: Local Time or City -->
          <div id="locale-title" class="mobile-only">Local Time</div>
        </div>

        <!-- Unified Buttons Stack -->
        <div class="button-stack">
          <button id="btn-details-desktop" class="ui-btn">Location Details</button>
          <button id="btn-select-loc" class="ui-btn">New Location</button>
        </div>

      </div>

      <!-- Bottom Left: View Controls -->
      <div id="bottom-left-container" class="ui-corner">
        <div id="clock-selector">
          <div class="selector-title">Select Clock</div>
          <div class="selector-options">
            <span id="opt-dayspiral" class="selector-opt active">DaySpiral</span>
            <span id="opt-mobius" class="selector-opt">Mobius</span>
          </div>
        </div>
        <div class="button-row-bottom-left">
          <button id="btn-zen" class="ui-btn">Zen</button>
          <button id="btn-fullscreen" class="ui-btn">Full Screen</button>
        </div>
      </div>

      <!-- Bottom Right: Settings & Footer -->
      <div id="bottom-right-container" class="ui-corner">
        <div class="button-group-bottom-right">

          <!-- DaySpiral Specific Controls -->
          <div id="controls-dayspiral" class="controls-group">
            <button id="btn-gmt" class="ui-btn">Show GMT</button>
            <button id="btn-setup-dayspiral" class="ui-btn gear-btn" title="DaySpiral Settings">⚙️</button>
          </div>

          <!-- Mobius Specific Controls (Hidden by default) -->
          <div id="controls-mobius" class="controls-group hidden">
            <button id="btn-rotate" class="ui-btn">Rotate</button>
            <button id="btn-hide-hours" class="ui-btn toggled-on">Hours</button>
            <div class="horizontal-row">
              <button id="btn-demo" class="ui-btn">Demo</button>
              <button id="btn-dali" class="ui-btn">Dali</button>
              <button id="btn-setup-mobius" class="ui-btn gear-btn" title="Mobius Settings">⚙️</button>
            </div>
          </div>

        </div>
      </div>

      <!-- End UI Layer -->
    </div>
    <!-- End Clock Container -->

    <!-- ========================================= -->
    <!-- MODALS -->
    <!-- ========================================= -->

    <div id="modal-overlay" class="hidden">

      <!-- Modal: Select Location -->
      <div id="modal-select-location" class="modal-content compact hidden">
        <div class="modal-content">
          <button class="modal-close">&times;</button>
          <h2>Select Location</h2>

          <!-- Preset Grid -->
          <div class="preset-grid">
            <button class="ui-btn preset" data-lat="51.5074" data-lon="-0.1278" data-tz="0"
              data-city="London">London</button>
            <button class="ui-btn preset" data-lat="40.7128" data-lon="-74.0060" data-tz="-5" data-city="New York">New
              York</button>
            <button class="ui-btn preset" data-lat="35.6895" data-lon="139.6917" data-tz="9"
              data-city="Tokyo">Tokyo</button>
            <button class="ui-btn preset" data-lat="-33.8688" data-lon="151.2093" data-tz="11"
              data-city="Sydney">Sydney</button>
            <button class="ui-btn preset" data-lat="48.8566" data-lon="2.3522" data-tz="1"
              data-city="Paris">Paris</button>
            <button class="ui-btn preset" data-lat="34.0522" data-lon="-118.2437" data-tz="-8"
              data-city="Los Angeles">Los Angeles</button>
          </div>

          <div class="separator"></div>

          <!-- City Lookup Section -->
          <div class="location-section">
            <h3>Search City</h3>
            <div class="input-row">
              <input type="text" id="city-search-input" class="modal-input"
                placeholder="Enter city name (e.g. Chicago)">
              <button id="btn-city-search" class="ui-btn">Search</button>
            </div>
            <div id="city-search-results" class="results-list hidden"></div>
          </div>

          <div class="separator"></div>

          <!-- Manual Lat/Lon Section -->
          <div class="location-section">
            <h3>Manual Coordinates</h3>
            <div class="input-row">
              <input type="number" id="input-lat" class="modal-input" placeholder="Lat" step="any">
              <input type="number" id="input-lon" class="modal-input" placeholder="Lon" step="any">
            </div>
            <div class="input-row">
              <input type="number" id="input-tz" class="modal-input" placeholder="UTC Offset" step="0.5">
              <button id="btn-manual-apply" class="ui-btn">Go</button>
            </div>
          </div>

        </div>
      </div>

      <!-- Modal: DaySpiral Setup -->
      <div id="modal-setup-dayspiral" class="modal-content hidden">
        <button class="modal-close">&times;</button>
        <h2>DaySpiral Settings</h2>
        <div class="modal-body">

          <div class="settings-section">
            <h3>Clock Style</h3>
            <div class="style-choice-container">
              <button id="btn-style-classic" class="ui-btn wide-btn toggled-on">Classic</button>
              <button id="btn-style-spiral" class="ui-btn wide-btn">Hours in Spiral</button>
            </div>
          </div>

          <hr class="separator">

          <div class="settings-section">
            <h3>Time Format</h3>
            <select id="select-dayspiral-time-format" class="modal-input">
              <option value="12" selected>12-hour (AM/PM)</option>
              <option value="24">24-hour (0-23)</option>
            </select>
          </div>

        </div>
        <div class="modal-actions">
          <button class="ui-btn btn-close-modal">OK</button>
        </div>
      </div>

      <!-- Modal: About -->
      <div id="modal-about" class="modal-content hidden">
        <button class="modal-close">&times;</button>
        <h2>About Day Spiral Clock</h2>
        <div class="modal-body" id="about-description">
          <!-- Content injected via JS -->
        </div>
        <button class="ui-btn btn-close-modal">OK</button>
      </div>

      <!-- Modal: Mobius Settings -->
      <div id="modal-setup-mobius" class="modal-content hidden">
        <button class="modal-close">&times;</button>
        <h2>Mobius Settings</h2>
        <div class="modal-body">

          <div class="settings-section">
            <h3>Indicator Shapes</h3>
            <div class="form-row">
              <label>Hours:</label>
              <select id="select-shape-hours" class="modal-input">
                <option value="sphere">Sphere</option>
                <option value="disc">Disc</option>
                <option value="ring">Ring</option>
                <option value="outer-ring" selected>Outer Ring</option>
              </select>
            </div>
            <div class="form-row">
              <label>Minutes:</label>
              <select id="select-shape-minutes" class="modal-input">
                <option value="sphere">Sphere</option>
                <option value="disc">Disc</option>
                <option value="ring" selected>Ring</option>
              </select>
            </div>
            <div class="form-row">
              <label>Seconds:</label>
              <select id="select-shape-seconds" class="modal-input">
                <option value="sphere" selected>Sphere</option>
                <option value="disc">Disc</option>
              </select>
            </div>
          </div>

          <hr class="separator">

          <div class="settings-section">
            <h3>Tick Marks</h3>
            <select id="select-tick-scheme" class="modal-input">
              <option value="standard" selected>Standard (Hour + Min/Sec)</option>
              <option value="minimal">Minimal (Hour Only)</option>
              <option value="alternating">Alternating Colors</option>
              <option value="alternating_ticks">Alternating Hour/Min</option>
            </select>
          </div>

          <hr class="separator">

          <div class="settings-section">
            <h3>Time Style</h3>
            <select id="select-time-style" class="modal-input">
              <option value="ampm" selected>12-hour (AM/PM)</option>
              <option value="24">24-hour</option>
            </select>
          </div>

        </div>
        <div class="modal-actions">
          <button class="ui-btn btn-close-modal">OK</button>
        </div>
      </div>

    </div>

  </div>
  </div>

  <!-- THREE.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script src="sketch.js"></script>

  <!-- App Modules -->
  <script src="js/TimeKeeper.js"></script>
  <script src="js/LocationManager.js"></script>
  <script src="js/ClockRenderer.js"></script>
  <script src="js/renderers/DaySpiralRenderer.js"></script>
  <script src="js/renderers/MobiusRenderer.js"></script>
  <script src="js/daySpiralHelper.js"></script>
</body>

</html>
